{% load static amish %}
<section class="phead">
  <div class="stage"{% if slides|length > 1 %} data-show="6000"{% endif %}>
    {% for s in slides %}
      <img class="sl ken{% if forloop.first %} on{% endif %}" src="{{ s.image.url }}" alt="{{ s.caption|default:heading }}"{% if not forloop.first %} loading="lazy"{% endif %}>
    {% empty %}
      <img class="sl on" src="{% bg cover fallback|default:"hero-1.jpg" %}" alt="{{ heading }}">
    {% endfor %}
  </div>
  <div class="tint"></div>
  <svg class="art" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <path d="M60 380V190l90-90 90 90v190M230 380V140l90-90 90 90v240" stroke="#fff" stroke-width="2"/>
    <path d="M0 300h400M0 332h400" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>
  </svg>
  <div class="wrap">
    {% block crumbs %}{% endblock %}
    {% if crumbs %}<div class="crumbs">{{ crumbs }}</div>{% endif %}
    <h1>{{ heading }}</h1>
    {% if sub %}<p>{{ sub }}</p>{% endif %}
  </div>
</section>
