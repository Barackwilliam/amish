services:
  - type: web
    name: amish
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /
    # Hakuna disk: free tier haiiruhusu, na bila disk picha zinapotea kila deploy.
    # Ndiyo maana picha zinahifadhiwa Supabase Storage (MEDIA_STORAGE=s3).
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "amish.co.tz,www.amish.co.tz,.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_STORAGE
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: "media"
      - key: S3_REGION
        sync: false
